<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warden Games — Ingresar</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>

  <header class="site-header">
    <span class="site-header__logo">Warden Games</span>
    <nav class="site-nav" aria-label="Navegación principal">
      <a href="./index.html">Home</a>
      <a href="./login.html" aria-current="page">Ingresar</a>
    </nav>
  </header>

  <main>
    <h1>Ingresar</h1>

    <!-- TODO: tabs para alternar entre Login y Registro -->
    <section id="login" class="card">
      <h2>Iniciar sesión</h2>
      <form id="login-form">
        <!-- TODO: validación de campos y submit (ver js/login.js) -->
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Ingresar</button>
      </form>
    </section>

    <section id="registro" class="card">
      <h2>Registrarse</h2>
      <form id="registro-form">
        <!-- TODO: validación de campos y submit (ver js/login.js) -->
        <div class="field">
          <label for="registro-nombre">Nombre de usuario</label>
          <input type="text" id="registro-nombre" name="nombre" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="registro-email">Email</label>
          <input type="email" id="registro-email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="registro-password">Contraseña</label>
          <input type="password" id="registro-password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Grupo 24 — Agustín Muzi y Francisco Fernández. TUDAI — UNICEN.</p>
  </footer>

  <script src="./js/api.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
