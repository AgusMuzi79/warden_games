<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warden Games — Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Roboto+Flex:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/footer.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="auth-shell">

    <!-- Panel de marca: solo presentación, no tiene ningún control. -->
    <section class="auth-brand">
      <img class="auth-brand__logo" src="assets/img/logo.png" alt="" width="96" height="96">
      <h1 class="auth-brand__title">Warden Games</h1>
      <p class="auth-brand__tagline">Miles de juegos, cero instalaciones. Entrás, jugás, seguís con tu día.</p>
    </section>

    <section class="auth-panel">
    <div class="auth-card">

      <!-- ===================== SELECTOR CREAR CUENTA / INGRESAR ===================== -->
      <div class="auth-switch" role="tablist" aria-label="Crear cuenta o iniciar sesión">
        <button type="button" class="auth-switch__btn active" id="switchRegister" role="tab" aria-selected="true" aria-controls="formRegister">Crear Cuenta</button>
        <button type="button" class="auth-switch__btn" id="switchLogin" role="tab" aria-selected="false" aria-controls="formLogin">Ingresar</button>
      </div>

      <!-- ===================== FORM: CREAR CUENTA ===================== -->
      <form class="auth-card__form active" id="formRegister" role="tabpanel" aria-labelledby="switchRegister" novalidate>

        <div class="field">
          <label for="reg-name">Nombre y Apellido</label>
          <input type="text" id="reg-name" name="fullname" placeholder="Belen Stoll" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="reg-nickname">NickName (opcional)</label>
            <input type="text" id="reg-nickname" name="nickname" placeholder="BelStoll">
          </div>
          <div class="field field--small">
            <label for="reg-age">Edad</label>
            <input type="number" id="reg-age" name="age" placeholder="18" min="0" required>
          </div>
        </div>

        <div class="field">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="reg-password">Contraseña</label>
            <div class="password-wrap">
              <input type="password" id="reg-password" name="password" placeholder="••••••••••" required minlength="8">
              <button type="button" class="toggle-pass" data-target="reg-password" aria-label="Mostrar contraseña">
                <i class="ph ph-eye-slash toggle-pass__icon" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="reg-password2">Repetir contraseña</label>
            <div class="password-wrap">
              <input type="password" id="reg-password2" name="password2" placeholder="••••••••••" required minlength="8">
              <button type="button" class="toggle-pass" data-target="reg-password2" aria-label="Mostrar contraseña">
                <i class="ph ph-eye-slash toggle-pass__icon" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <label class="check-block check-block--captcha">
          <input type="checkbox" id="reg-captcha" required>
          <span class="check-block__mark"></span>
          <span class="check-block__label">No soy un robot</span>
          <span class="recaptcha">
            <svg viewBox="0 0 24 24" class="recaptcha__icon"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 3a3 3 0 013 3v1h-2V8a1 1 0 00-2 0v1H9V8a3 3 0 013-3zm-4 6h8v7a2 2 0 01-2 2h-4a2 2 0 01-2-2v-7z"/></svg>
            <span class="recaptcha__text">reCAPTCHA</span>
          </span>
        </label>

        <label class="check-block check-block--terms">
          <input type="checkbox" id="reg-terms" required>
          <span class="check-block__mark"></span>
          <span class="check-block__label">Acepto los <a href="#" class="link">términos</a> y la <a href="#" class="link">política de privacidad</a></span>
        </label>

        <button type="submit" class="btn btn--primario">Registrarse</button>

        <div class="divider"><span>o</span></div>

        <button type="button" class="btn btn--secundario">
          <svg class="social-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.2 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continuar con Google
        </button>

        <button type="button" class="btn btn--secundario">
          <svg class="social-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M15.5 12.4h-2.1v7.4h-3v-7.4H9v-2.6h1.4V8.3c0-1.6.8-3.1 3.4-3.1h2v2.5h-1.4c-.4 0-.9.2-.9 1v1.1h2.4l-.4 2.6z"/></svg>
          Continuar con Facebook
        </button>

      </form>

      <!-- Se muestra en vez del form de registro cuando el registro sale bien.
           role="status" hace que el lector de pantalla lo anuncie solo, sin
           que el foco se mueva. Lo togglea login.js. -->
      <div class="auth-success" id="registerSuccess" role="status" hidden>
        <i class="ph ph-check-circle auth-success__icon" aria-hidden="true"></i>
        <p class="auth-success__title">¡Cuenta creada!</p>
        <p class="auth-success__text">Te llevamos al inicio en un momento...</p>
      </div>

      <!-- ===================== FORM: INGRESAR ===================== -->
      <form class="auth-card__form" id="formLogin" role="tabpanel" aria-labelledby="switchLogin" novalidate>

        <div class="field">
          <label for="log-email">E-mail</label>
          <input type="email" id="log-email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="field">
          <label for="log-password">Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="log-password" name="password" placeholder="••••••••••" required>
            <button type="button" class="toggle-pass" data-target="log-password" aria-label="Mostrar contraseña">
              <i class="ph ph-eye-slash toggle-pass__icon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <label class="check-block check-block--remember">
          <input type="checkbox" id="log-remember">
          <span class="check-block__mark"></span>
          <span class="check-block__label">Mantener la sesión iniciada</span>
        </label>

        <button type="submit" class="btn btn--primario">Ingresar</button>

        <div class="divider"><span>o</span></div>

        <button type="button" class="btn btn--secundario">
          <svg class="social-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.2 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continuar con Google
        </button>

        <button type="button" class="btn btn--secundario">
          <svg class="social-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M15.5 12.4h-2.1v7.4h-3v-7.4H9v-2.6h1.4V8.3c0-1.6.8-3.1 3.4-3.1h2v2.5h-1.4c-.4 0-.9.2-.9 1v1.1h2.4l-.4 2.6z"/></svg>
          Continuar con Facebook
        </button>

      </form>

    </div>
    </section>

  </main>
  <script src="./js/login.js" defer></script>
</body>
</html>
